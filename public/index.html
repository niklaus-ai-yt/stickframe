<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="sf-token" content="__SF_TOKEN__">
  <title>Stickframe Studio</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#" data-go="home">
        <img src="/logo.svg" alt="" width="34" height="34">
        <span class="brand-name">Stickframe</span>
      </a>
      <button class="btn primary block" data-action="new-project">+ New video</button>
      <div class="side-label">Your videos</div>
      <nav class="project-list" id="projectList"></nav>
      <div class="side-foot">
        <button class="btn ghost block" data-action="open-settings">⚙ Settings</button>
        <div class="version">v__SF_VERSION__ · free &amp; open source</div>
      </div>
    </aside>

    <main class="main" id="main"></main>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="modal-x" data-action="close-modal" aria-label="Close">×</button>
      <div id="modalBody"></div>
    </div>
  </div>
  <div class="toasts" id="toasts"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
